<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網頁瀏覽計數器</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --success: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef4ff, var(--bg));
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: var(--text);
    }

    body.compact {
      min-height: 21px;
      background: transparent;
    }

    .card {
      width: min(92vw, 420px);
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.12);
      padding: 32px 24px;
      text-align: center;
    }

    body.compact .card {
      width: 55px;
      height: 21px;
      min-height: 21px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 6px;
      box-shadow: none;
    }

    .title {
      margin: 0 0 12px;
      font-size: 2rem;
      font-weight: 700;
    }

    body.compact .title {
      display: none;
    }

    .count {
      margin: 18px 0 24px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.04em;
    }

    body.compact .count {
      margin: 0;
      font-size: 0.75rem;
      line-height: 21px;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
      min-height: 1.4em;
      margin-bottom: 18px;
    }

    body.compact .status,
    body.compact button {
      display: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 14px 18px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">瀏覽次數</h1>
    <div id="count" class="count">載入中...</div>
    <div id="status" class="status">更新中...</div>
    <button id="refreshBtn" type="button">重新載入計數</button>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxcMJtY4Xyd3D67e5i0Ev0oWzSGH_1Y2NEKduBPnp0e5-1vYuT5xMSsukytusQb-V5J8A/exec';

    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');

    async function fetchCount(action = 'get') {
      const url = `${GAS_WEB_APP_URL}?action=${encodeURIComponent(action)}`;

      try {
        statusEl.textContent = '讀取中...';
        refreshBtn.disabled = true;

        const response = await fetch(url, { method: 'GET' });
        if (!response.ok) {
          throw new Error(`HTTP 錯誤: ${response.status}`);
        }

        const data = await response.json();
        const value = Number(data.count || 0);
        countEl.textContent = value.toLocaleString();
        statusEl.textContent = action === 'increment' ? '計數已更新' : '目前瀏覽次數';
      } catch (error) {
        console.error(error);
        countEl.textContent = '錯誤';
        statusEl.textContent = '無法連線到計數器，請確認 GAS 網址是否正確';
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', () => {
      fetchCount('increment');
    });

    const compactMode = new URLSearchParams(window.location.search).get('compact') === '1';
    document.body.classList.toggle('compact', compactMode);

    fetchCount('increment');
  </script>
</body>
</html>
