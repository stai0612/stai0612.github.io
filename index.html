<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="成大南工學生的個人自我介紹首頁">
  <title>我的個人首頁 | 成大南工</title>
  <style>
    :root {
      --blue: #1557d6;
      --deep-blue: #0d2d70;
      --yellow: #ffd84d;
      --green: #36b37e;
      --ink: #17253d;
      --muted: #61708a;
      --paper: #f6f9ff;
      --white: #ffffff;
      --line: #dce6f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 90% 8%, rgba(255, 216, 77, 0.28) 0 8rem, transparent 8.1rem),
        radial-gradient(circle at 8% 86%, rgba(54, 179, 126, 0.15) 0 11rem, transparent 11.1rem),
        var(--paper);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 28px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--deep-blue);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .brand-mark {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 7px 4px 0 var(--green);
    }

    .nav-link {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(290px, 0.85fr);
      align-items: center;
      gap: 72px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 84px 28px 108px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: var(--blue);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .eyebrow::before {
      width: 27px;
      height: 4px;
      border-radius: 10px;
      background: var(--green);
      content: "";
    }

    h1 {
      max-width: 620px;
      margin: 0;
      color: var(--deep-blue);
      font-size: clamp(2.6rem, 6vw, 5.4rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    h1 strong {
      color: var(--blue);
      font-weight: 900;
    }

    .intro {
      max-width: 560px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 1.12rem;
    }

    .hero-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 23px;
      border-radius: 10px;
      font-weight: 800;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 20px rgba(13, 45, 112, 0.16);
    }

    .button-primary {
      color: var(--white);
      background: var(--blue);
    }

    .button-secondary {
      color: var(--deep-blue);
      border: 2px solid var(--line);
      background: var(--white);
    }

    .profile-art {
      position: relative;
      min-height: 390px;
      padding: 30px;
      border-radius: 30px;
      background: var(--blue);
      box-shadow: 18px 20px 0 var(--yellow);
      isolation: isolate;
    }

    .profile-art::before,
    .profile-art::after {
      position: absolute;
      border-radius: 50%;
      content: "";
      z-index: -1;
    }

    .profile-art::before {
      top: -44px;
      right: -42px;
      width: 125px;
      height: 125px;
      background: var(--green);
    }

    .profile-art::after {
      bottom: 25px;
      left: -55px;
      width: 100px;
      height: 100px;
      border: 16px solid var(--yellow);
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 330px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.12);
    }

    .avatar {
      display: grid;
      width: 78px;
      height: 78px;
      place-items: center;
      border-radius: 22px;
      color: var(--deep-blue);
      background: var(--yellow);
      font-size: 2rem;
      font-weight: 900;
    }

    .profile-card h2 {
      margin: 30px 0 4px;
      color: var(--white);
      font-size: 2rem;
    }

    .profile-card p {
      margin: 0;
      color: #dce8ff;
    }

    .school-tag {
      align-self: flex-start;
      margin-top: 28px;
      padding: 5px 13px;
      border-radius: 99px;
      color: var(--deep-blue);
      background: var(--white);
      font-size: 0.87rem;
      font-weight: 800;
    }

    .section {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 28px 100px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--deep-blue);
      font-size: 2rem;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
    }

    .interest-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .interest {
      min-height: 190px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--white);
      transition: transform 180ms ease;
    }

    .interest:hover {
      transform: translateY(-5px);
    }

    .interest-icon {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 12px;
      font-size: 1.35rem;
    }

    .interest:nth-child(1) .interest-icon {
      background: #e4edff;
    }

    .interest:nth-child(2) .interest-icon {
      background: #fff2b5;
    }

    .interest:nth-child(3) .interest-icon {
      background: #d9f6e8;
    }

    .interest h3 {
      margin: 18px 0 4px;
      color: var(--deep-blue);
      font-size: 1.15rem;
    }

    .interest p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    footer {
      padding: 26px 28px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      nav {
        padding: 22px 20px 8px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 58px;
        padding: 64px 20px 90px;
      }

      .profile-art {
        min-height: 350px;
        box-shadow: 11px 13px 0 var(--yellow);
      }

      .section {
        padding: 0 20px 72px;
      }

      .section-heading {
        display: block;
      }

      .section-heading p {
        margin-top: 7px;
      }

      .interest-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav aria-label="主要導覽">
      <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"></span>MY PROFILE</a>
      <a class="nav-link" href="#interests">我的專長</a>
    </nav>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div>
          <p class="eyebrow">HELLO, NICE TO MEET YOU</p>
          <h1 id="hero-title">嗨！我是<br><strong>成大南工學生</strong></h1>
          <p class="intro">這是我的個人首頁。平常喜歡探索有趣的事物，用自己的步調享受校園生活，也期待認識更多新朋友。</p>
          <div class="hero-links">
            <a class="button button-primary" href="#interests">認識我的專長</a>
            <a class="button button-secondary" href="#about">關於我</a>
          </div>
        </div>

        <div class="profile-art" aria-label="個人資料卡裝飾">
          <div class="profile-card">
            <div>
              <div class="avatar" aria-hidden="true">我</div>
              <h2>我的小檔案</h2>
              <p>成大南工・學生</p>
            </div>
            <span class="school-tag">正在成長中</span>
          </div>
        </div>
      </section>

      <section class="section" id="about" aria-labelledby="about-title">
        <div class="section-heading">
          <div>
            <h2 id="about-title">關於我</h2>
            <p>簡單介紹一下我的日常喜好</p>
          </div>
        </div>

        <div class="interest-grid" id="interests">
          <article class="interest">
            <div class="interest-icon" aria-hidden="true">🎮</div>
            <h3>打電動</h3>
            <p>享受遊戲帶來的挑戰與成就感。</p>
          </article>
          <article class="interest">
            <div class="interest-icon" aria-hidden="true">🕹️</div>
            <h3>玩電動</h3>
            <p>在遊戲世界裡放鬆，和朋友一起同樂。</p>
          </article>
          <article class="interest">
            <div class="interest-icon" aria-hidden="true">📱</div>
            <h3>滑手機</h3>
            <p>看看新資訊，探索每天有趣的內容。</p>
          </article>
        </div>
      </section>
    </main>

    <footer>我的喜歡色彩：<strong style="color: var(--blue);">藍色</strong>・<strong style="color: #c49b00;">黃色</strong>・<strong style="color: var(--green);">綠色</strong></footer>
  </div>
</body>
</html>
