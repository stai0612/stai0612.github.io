<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>手機火柴人跳躍遊戲</title>
  <style>
    :root {
      --bg1: #b9ebff;
      --bg2: #dff8ff;
      --sky: #88d7ff;
      --ground: #4c8f6b;
      --grass: #70c779;
      --char: #1e2022;
      --obstacle: #e76f51;
      --danger: #ff6b6b;
      --panel: rgba(18, 28, 39, 0.72);
      --panel-border: rgba(255,255,255,0.2);
      --text: #ffffff;
      --yellow: #ffd166;
      --shadow: rgba(0, 0, 0, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(var(--bg1), var(--bg2));
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(#7dd3fc 0%, #dff8ff 58%, #eaffd8 100%);
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    #lives {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    #score {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 18px var(--shadow);
    }

    #status {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--text);
      font-weight: 700;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 18px var(--shadow);
    }

    #game {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: pointer;
    }

    .sky {
      position: absolute;
      inset: 0 0 24% 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.78);
      border-radius: 999px;
      box-shadow: 20px 8px 0 rgba(255,255,255,0.56), 42px -8px 0 rgba(255,255,255,0.7);
      opacity: 0.8;
    }

    .cloud:nth-child(1) { width: 110px; height: 28px; left: 12%; top: 10%; }
    .cloud:nth-child(2) { width: 130px; height: 30px; left: 58%; top: 18%; }
    .cloud:nth-child(3) { width: 100px; height: 26px; left: 74%; top: 10%; }

    #ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 24%;
      background: linear-gradient(180deg, var(--ground), #3f7755);
      border-top: 4px solid #7ae38f;
      box-shadow: inset 0 10px 18px rgba(255,255,255,0.08);
    }

    #ground::before {
      content: "";
      position: absolute;
      inset: -14px 0 auto 0;
      height: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.36), rgba(255,255,255,0));
    }

    .grass {
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: 24%;
      height: 18px;
      background:
        repeating-linear-gradient(
          90deg,
          var(--grass) 0 18px,
          #6bc06a 18px 34px,
          #5db469 34px 52px
        );
      transform: skewY(-2deg);
      opacity: 0.9;
    }

    #character {
      position: absolute;
      left: 74px;
      bottom: 22px;
      width: 96px;
      height: 120px;
      transform-origin: center bottom;
      z-index: 10;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,0.12));
      transition: transform 0.12s ease;
    }

    .body-part {
      position: absolute;
      background: #1b1d1f;
      border-radius: 999px;
      transform-origin: center;
      transition: transform 0.12s ease, opacity 0.12s ease;
      box-shadow: inset -2px -2px 0 rgba(255,255,255,0.08);
    }

    .head {
      left: 22px;
      top: 0;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #1d1d1f;
      border: 4px solid #f4f7ff;
      box-shadow: inset -6px -6px 0 rgba(255,255,255,0.12);
    }

    .torso {
      left: 38px;
      top: 42px;
      width: 12px;
      height: 42px;
      border-radius: 12px;
    }

    .arm-left, .arm-right {
      left: 44px;
      top: 48px;
      width: 12px;
      height: 30px;
      border-radius: 14px;
    }

    .arm-left {
      transform: rotate(28deg);
    }

    .arm-right {
      left: 23px;
      transform: rotate(-28deg);
    }

    .leg-left, .leg-right {
      left: 39px;
      top: 78px;
      width: 12px;
      height: 36px;
      border-radius: 14px;
    }

    .leg-left {
      transform: rotate(20deg);
    }

    .leg-right {
      left: 52px;
      transform: rotate(-20deg);
    }

    #character.idle .arm-left { transform: rotate(22deg); }
    #character.idle .arm-right { transform: rotate(-22deg); }
    #character.idle .leg-left { transform: rotate(14deg); }
    #character.idle .leg-right { transform: rotate(-14deg); }
    #character.idle .torso { transform: rotate(0deg); }
    #character.idle .head { transform: translateY(0); }

    #character.jump .arm-left { transform: rotate(82deg); }
    #character.jump .arm-right { transform: rotate(-82deg); }
    #character.jump .leg-left { transform: rotate(56deg); }
    #character.jump .leg-right { transform: rotate(-56deg); }
    #character.jump .torso { transform: rotate(-12deg); }
    #character.jump .head { transform: translateY(-4px); }

    #character.jump .flash {
      background: rgba(255,255,255,0.75);
    }

    .face {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    .weapon {
      position: absolute;
      left: 58px;
      top: 54px;
      width: 92px;
      height: 18px;
      transform-origin: 10px 50%;
      transform: rotate(-26deg);
      z-index: 12;
      transition: transform 0.12s ease;
    }

    .weapon .handle {
      position: absolute;
      left: 0;
      top: 4px;
      width: 18px;
      height: 8px;
      background: linear-gradient(180deg, #4a2d1b, #1f120d);
      border-radius: 20px;
      border: 2px solid rgba(20, 20, 20, 0.9);
      box-shadow: inset -2px -2px 0 rgba(255,255,255,0.08);
    }

    .weapon .blade {
      position: absolute;
      left: 14px;
      top: -9px;
      width: 70px;
      height: 34px;
      background: linear-gradient(180deg, #f3f4f6 0%, #dfe5ed 30%, #b8c1ce 100%);
      border: 3px solid rgba(70, 81, 98, 0.7);
      border-left-width: 0;
      border-radius: 8px 14px 14px 12px;
      clip-path: polygon(0 32%, 100% 12%, 100% 46%, 0 100%);
      box-shadow: inset -8px 0 rgba(255,255,255,0.22), 0 4px 10px rgba(48, 52, 70, 0.18);
    }

    .weapon .blade::before {
      content: "";
      position: absolute;
      right: 14px;
      top: 6px;
      width: 26px;
      height: 16px;
      background: rgba(255,255,255,0.25);
      border-radius: 6px;
      transform: skewX(-18deg);
    }

    #character.attacking .weapon {
      transform: rotate(24deg) translateX(12px) translateY(-2px);
    }

    #character.jump .weapon {
      transform: rotate(-34deg) translateY(-4px);
    }

    #character.idle .weapon {
      transform: rotate(-26deg);
    }

    #obstacle-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
    }

    .obstacle {
      position: absolute;
      bottom: 22px;
      background: linear-gradient(180deg, #ffb703, #f77f00);
      border: 3px solid rgba(135, 54, 17, 0.18);
      border-radius: 12px;
      box-shadow: inset -7px 0 rgba(255,255,255,0.15), 0 8px 16px rgba(247,127,0,0.26);
    }

    .obstacle::before {
      content: "";
      position: absolute;
      inset: 10% 20% 10% 20%;
      border-radius: 6px;
      background: rgba(255,255,255,0.25);
    }

    .obstacle::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      right: 10%;
      top: 12%;
      border-radius: 6px;
      background: rgba(255,255,255,0.32);
    }

    #message {
      position: absolute;
      left: 50%;
      bottom: 28%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(17, 24, 39, 0.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.12);
      text-align: center;
      backdrop-filter: blur(3px);
      transition: opacity 0.2s ease;
    }

    .hidden { opacity: 0; }

    #game-over {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 17, 27, 0.38);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #game-over.show {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      width: min(82vw, 360px);
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      padding: 20px 20px 16px;
      text-align: center;
      color: var(--text);
      box-shadow: 0 20px 48px rgba(0,0,0,0.28);
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 6vw, 34px);
    }

    .panel p {
      margin: 0 0 16px;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
    }

    #restart-btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      color: #17314a;
      background: linear-gradient(180deg, #fef08a, #facc15);
      box-shadow: 0 12px 24px rgba(250, 204, 21, 0.26);
      cursor: pointer;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      background: linear-gradient(180deg, rgba(125,211,252,0.75), rgba(255,255,255,0.2));
      backdrop-filter: blur(3px);
      transition: opacity 0.25s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-card {
      width: min(78vw, 340px);
      padding: 24px 18px 20px;
      background: rgba(255,255,255,0.88);
      border: 2px solid rgba(255,255,255,0.75);
      border-radius: 28px;
      box-shadow: 0 22px 42px rgba(0,0,0,0.14);
      text-align: center;
      color: #153248;
    }

    .start-card h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 8vw, 46px);
      letter-spacing: 2px;
    }

    .start-card p {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.5;
      color: #23435f;
    }

    #start-btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #3ab7ff, #1d8fe2);
      box-shadow: 0 12px 24px rgba(29,143,226,0.26);
      cursor: pointer;
    }

    #attack-btn {
      position: absolute;
      right: 18px;
      bottom: 16%;
      z-index: 25;
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(180deg, #ff7a7a, #ff4d6d);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 18px 32px rgba(255, 77, 109, 0.35);
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    #attack-btn:active {
      transform: scale(0.96);
    }

    #attack-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    #character.attacking .arm-left {
      transform: rotate(92deg) translateY(-2px);
    }

    #character.attacking .arm-right {
      transform: rotate(-92deg) translateY(-1px);
    }

    #character.attacking .torso {
      transform: rotate(6deg);
    }

    #character.attacking .flash {
      opacity: 1;
    }

    .obstacle.destroyed {
      opacity: 0;
      transform: scale(0.1);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    @media (max-width: 480px) {
      #attack-btn {
        right: 12px;
        bottom: 18%;
        width: 64px;
        height: 64px;
        font-size: 18px;
      }

      #character {
        left: 52px;
        width: 72px;
        height: 94px;
      }

      .head {
        left: 14px;
        width: 38px;
        height: 38px;
      }

      .torso {
        left: 28px;
        top: 32px;
        height: 32px;
      }

      .arm-left, .arm-right {
        left: 31px;
        top: 38px;
        height: 24px;
      }

      .arm-right { left: 17px; }

      .leg-left, .leg-right {
        left: 26px;
        top: 62px;
        height: 30px;
      }

      .leg-right {
        left: 42px;
      }

      .eye.left { left: 26px; }
      .eye.right { left: 41px; }
      .smile { left: 31px; top: 20px; }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div id="lives">❤ ❤ ❤ ❤ ❤</div>
      <div id="score">分數: 0</div>
      <div id="status">待開始</div>
    </div>

    <div id="start-screen">
      <div class="start-card">
        <h1>跳躍冒險</h1>
        <p>點擊畫面或按空白鍵開始<br>避開障礙物，保住 5 次機會！</p>
        <button id="start-btn" type="button">開始遊戲</button>
      </div>
    </div>

    <div id="game" aria-label="火柴人跳躍遊戲" role="button" tabindex="0">
      <div class="sky"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>

      <div id="obstacle-layer"></div>

      <div id="character" class="idle" aria-label="玩家角色">
        <div class="flash"></div>
        <div class="head"></div>
        <div class="body-part torso"></div>
        <div class="body-part arm-left"></div>
        <div class="body-part arm-right"></div>
        <div class="body-part leg-left"></div>
        <div class="body-part leg-right"></div>
        <div class="weapon" aria-hidden="true">
          <div class="handle"></div>
          <div class="blade"></div>
        </div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="smile"></div>
        </div>
      </div>

      <button id="attack-btn" type="button" aria-label="攻擊">攻擊</button>
      <div class="grass"></div>
      <div id="ground"></div>
      <div id="message">點擊螢幕或按空白鍵跳躍</div>
    </div>

    <div id="game-over" aria-live="polite">
      <div class="panel">
        <h2>遊戲結束</h2>
        <p id="result-text">你碰到障礙物 5 次</p>
        <button id="restart-btn" type="button">再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const gameWrap = document.getElementById('game-wrap');
    const startScreen = document.getElementById('start-screen');
    const character = document.getElementById('character');
    const obstacleLayer = document.getElementById('obstacle-layer');
    const message = document.getElementById('message');
    const livesLabel = document.getElementById('lives');
    const scoreLabel = document.getElementById('score');
    const statusLabel = document.getElementById('status');
    const gameOverPanel = document.getElementById('game-over');
    const resultText = document.getElementById('result-text');
    const restartBtn = document.getElementById('restart-btn');
    const startBtn = document.getElementById('start-btn');
    const flash = character.querySelector('.flash');
    const attackBtn = document.getElementById('attack-btn');

    let audioCtx = null;

    const state = {
      running: false,
      ended: false,
      lives: 5,
      speed: 6.1,
      baseSpeed: 6.1,
      groundHeight: 0,
      characterY: 0,
      velocityY: 0,
      gravity: 0.72,
      jumpPower: 15.2,
      obstacleTimer: 0,
      minSpawnTime: 1050,
      maxSpawnTime: 1800,
      lastTime: 0,
      hitCooldown: 0,
      attackCooldown: 0,
      obstacles: [],
      score: 0
    };

    function initAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
          audioCtx = new Ctx();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, volume = 0.06, type = 'square', sweep = 0) {
      if (!audioCtx) return;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (sweep) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(30, freq + sweep), audioCtx.currentTime + duration);
      }

      gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function playJumpSound() {
      playTone(420, 0.14, 0.08, 'square', 260);
      setTimeout(() => playTone(680, 0.12, 0.06, 'triangle', 180), 30);
    }

    function playHitSound() {
      playTone(180, 0.2, 0.09, 'sawtooth', -120);
      setTimeout(() => playTone(70, 0.22, 0.07, 'square', -40), 70);
    }

    function triggerAttack() {
      if (!state.running || state.ended || state.attackCooldown > 0) return;

      state.attackCooldown = 520;
      character.classList.add('attacking');
      setTimeout(() => {
        character.classList.remove('attacking');
      }, 180);

      const attackRange = {
        left: getCharacterRect().left + 30,
        right: getCharacterRect().right + 72,
        top: getCharacterRect().top - 12,
        bottom: getCharacterRect().bottom + 18
      };

      let destroyed = false;
      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const obs = state.obstacles[i];
        const obsRect = getObstacleRect(obs);

        if (rectsIntersect(attackRange, obsRect)) {
          obs.element.classList.add('destroyed');
          setTimeout(() => {
            if (obs.element && obs.element.parentNode) {
              obs.element.remove();
            }
          }, 120);
          state.obstacles.splice(i, 1);
          state.score += 25;
          destroyed = true;
        }
      }

      if (destroyed) {
        playTone(220, 0.12, 0.06, 'triangle', 110);
        statusLabel.textContent = '擊破障礙物';
        setTimeout(() => {
          if (state.running && !state.ended) {
            statusLabel.textContent = '遊戲中';
          }
        }, 250);
      }
    }

    function updateLives() {
      const hearts = Array(state.lives).fill('❤').join(' ');
      const empty = Array(Math.max(0, 5 - state.lives)).fill('♡').join(' ');
      livesLabel.textContent = `${hearts} ${empty}`.trim();
    }

    function updateScore() {
      scoreLabel.textContent = `分數: ${Math.floor(state.score)}`;
    }

    function startRound() {
      state.running = true;
      state.ended = false;
      state.lives = 5;
      state.speed = state.baseSpeed;
      state.characterY = 0;
      state.velocityY = 0;
      state.obstacleTimer = 700;
      state.hitCooldown = 0;
      state.attackCooldown = 0;
      state.score = 0;
      updateLives();
      updateScore();
      statusLabel.textContent = '遊戲中';
      message.textContent = '點擊螢幕或按空白鍵跳躍';
      message.classList.remove('hidden');
      gameOverPanel.classList.remove('show');
      startScreen.classList.add('hidden');

      for (const obs of state.obstacles) {
        obs.element.remove();
      }
      state.obstacles = [];

      character.style.bottom = '22px';
      character.classList.remove('jump');
      character.classList.add('idle');
      character.classList.remove('attacking');
      attackBtn.disabled = false;
    }

    function jump() {
      if (state.ended) return;
      if (!state.running && !state.ended) {
        startRound();
      }
      if (state.characterY <= 0.1) {
        state.velocityY = state.jumpPower;
        state.characterY = 1;
        playJumpSound();
      }
    }

    function spawnObstacle() {
      const obstacle = document.createElement('div');
      const width = 24 + Math.random() * 28;
      const height = 34 + Math.random() * 62;
      obstacle.className = 'obstacle';
      obstacle.style.width = `${width}px`;
      obstacle.style.height = `${height}px`;
      obstacle.style.left = `${window.innerWidth + 30}px`;
      obstacle.style.bottom = '22px';
      obstacleLayer.appendChild(obstacle);

      state.obstacles.push({
        element: obstacle,
        x: window.innerWidth + 30,
        width,
        height,
        passed: false
      });

      const nextDelay = state.minSpawnTime + Math.random() * (state.maxSpawnTime - state.minSpawnTime);
      state.obstacleTimer = nextDelay;
    }

    function getCharacterRect() {
      const rect = character.getBoundingClientRect();
      const gameRect = game.getBoundingClientRect();
      return {
        left: rect.left - gameRect.left + 10,
        top: rect.top - gameRect.top + 8,
        right: rect.right - gameRect.left - 10,
        bottom: rect.bottom - gameRect.top - 6,
        width: rect.width - 20,
        height: rect.height - 12
      };
    }

    function getObstacleRect(obs) {
      const rect = obs.element.getBoundingClientRect();
      const gameRect = game.getBoundingClientRect();
      return {
        left: rect.left - gameRect.left,
        top: rect.top - gameRect.top,
        right: rect.right - gameRect.left,
        bottom: rect.bottom - gameRect.top,
        width: rect.width,
        height: rect.height
      };
    }

    function rectsIntersect(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    function handleHit() {
      if (state.hitCooldown > 0 || state.ended) return;
      state.lives -= 1;
      state.hitCooldown = 1100;
      updateLives();
      playHitSound();
      flash.style.opacity = '1';
      setTimeout(() => { flash.style.opacity = '0'; }, 120);

      if (state.lives <= 0) {
        endGame();
      }
    }

    function updateCharacter() {
      state.velocityY -= state.gravity;
      state.characterY += state.velocityY;

      if (state.characterY < 0) {
        state.characterY = 0;
        state.velocityY = 0;
      }

      const yPx = state.characterY;
      character.style.bottom = `${22 + yPx}px`;
      if (yPx > 0.5) {
        character.classList.remove('idle');
        character.classList.add('jump');
      } else {
        character.classList.remove('jump');
        character.classList.add('idle');
      }
    }

    function updateObstacles() {
      const speed = state.speed;
      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const obs = state.obstacles[i];
        obs.x -= speed;
        obs.element.style.left = `${obs.x}px`;

        const playerRect = getCharacterRect();
        const obstacleRect = getObstacleRect(obs);

        if (rectsIntersect(playerRect, obstacleRect)) {
          handleHit();
        }

        if (obs.x + obs.width < 0) {
          obs.element.remove();
          state.obstacles.splice(i, 1);
        }
      }
    }

    function endGame() {
      state.running = false;
      state.ended = true;
      statusLabel.textContent = '遊戲結束';
      resultText.textContent = `你碰到障礙物 ${5 - state.lives} 次\n分數 ${Math.floor(state.score)}`;
      message.textContent = '按重新開始再挑戰一次';
      message.classList.remove('hidden');
      gameOverPanel.classList.add('show');
      startScreen.classList.add('hidden');
      attackBtn.disabled = true;
    }

    function update(delta) {
      if (!state.running) return;

      state.hitCooldown = Math.max(0, state.hitCooldown - delta);
      state.attackCooldown = Math.max(0, state.attackCooldown - delta);
      state.obstacleTimer -= delta;
      state.score += delta * 0.02;
      state.speed = Math.min(state.baseSpeed + state.score * 0.08, 19.5);
      state.minSpawnTime = Math.max(650, 1050 - state.score * 4);
      state.maxSpawnTime = Math.max(980, 1800 - state.score * 6);
      updateScore();

      if (state.attackCooldown <= 0) {
        attackBtn.disabled = false;
      } else {
        attackBtn.disabled = true;
      }

      if (state.obstacleTimer <= 0) {
        spawnObstacle();
      }

      updateCharacter();
      updateObstacles();

      if (state.characterY > 0) {
        message.classList.add('hidden');
      }
    }

    function loop(timestamp) {
      if (!state.lastTime) state.lastTime = timestamp;
      const delta = timestamp - state.lastTime;
      state.lastTime = timestamp;
      update(delta);
      requestAnimationFrame(loop);
    }

    function handlePointer(event) {
      if (event.target.closest('button')) return;
      initAudio();
      if (!state.running && !state.ended) {
        startRound();
      }
      jump();
    }

    function handleStartScreenPointer(event) {
      if (event.target.closest('button')) return;
      event.preventDefault();
      initAudio();
      startRound();
      jump();
    }

    function handleKeydown(event) {
      if (event.code === 'Space') {
        event.preventDefault();
        initAudio();
        if (!state.running && !state.ended) {
          startRound();
        }
        jump();
      }
    }

    game.addEventListener('pointerdown', handlePointer);
    startScreen.addEventListener('pointerdown', handleStartScreenPointer);
    document.addEventListener('keydown', handleKeydown);
    game.setAttribute('tabindex', '0');
    attackBtn.addEventListener('click', () => {
      initAudio();
      triggerAttack();
    });

    startBtn.addEventListener('click', () => {
      initAudio();
      startRound();
      jump();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      startRound();
      jump();
    });

    updateLives();
    updateScore();
    statusLabel.textContent = '待開始';
    attackBtn.disabled = true;
    character.classList.add('idle');
    requestAnimationFrame(loop);
  </script>
</body>
</html>
